name: RegionRTP
version: '${version}'
main: dev.kyuba.region_rtp.RegionRTP
api-version: '1.18'
author: Kyuba
website: https://github.com/Kyuba173/regionRTP

description: Random teleport plugin for WorldGuard regions.

depend:
  - WorldGuard

commands:
  regionrtp:
    description: Randomized region spawn teleportation.
    usage: /regionrtp <region>
    permission: regionrtp.use
  rrtp:
    description: Admin commands for managing RegionRTP regions and settings.
    usage: /rrtp <add|remove|set|list|info|config|reload>
    permission: regionrtp.admin

permissions:
  regionrtp.use:
    description: Base permission required to use /regionrtp.
    default: op
  regionrtp.*:
    description: Allows teleporting to any configured region.
    default: op
  regionrtp.admin:
    description: Allows managing regions and settings via /rrtp.
    default: op
  regionrtp.admin.reload:
    description: Allows reloading the RegionRTP config.
    default: op