# RegionRTP configuration.

# regions: per-region settings — logical id → WorldGuard region
# spawn: global candidate search settings (applies to all regions)

regions:

  castle:
    world: world
    region: castle_region
    require-sky-exposure: true    # no solid blocks above head. default: true
    allow-water: false            # allow spawning in water. default: false
    teleport-delay-seconds: 0     # stand-still delay before teleport (0-60). default: 0
    cooldown-seconds: 0           # cooldown after teleport (0-3600). default: 0

spawn:
  attempts: 50                    # candidates per teleport (1-500). default: 50
  edge-distance: 5               # edge band width in blocks (0-256). default: 5
  minimum-player-distance: 15    # preferred min distance from players (0-1024). default: 15