name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Build
        run: ./gradlew clean build

      - uses: actions/upload-artifact@v4
        with:
          name: regionRTP
          path: build/libs/*.jar